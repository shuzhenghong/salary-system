<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员档案 - 人员薪酬管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <div class="layout">
        <div class="sidebar"></div>
        <div class="main-content">
            <div class="top-header">
                <span class="page-title">人员档案管理</span>
                <div class="user-info">
                    <span id="username"></span>
                    <button class="btn btn-sm btn-outline" onclick="logout()">退出</button>
                </div>
            </div>
            <div class="page-body">
                <div class="card">
                    <div class="toolbar">
                        <input type="text" class="form-control" id="searchName" placeholder="姓名搜索" style="min-width:120px;">
                        <div id="ssDept" style="min-width:160px;"></div>
                        <div id="ssUnit" style="min-width:160px;"></div>
                        <div id="ssStatus" style="min-width:120px;"></div>
                        <button class="btn btn-primary" onclick="loadStaff(1)">查询</button>
                        <button class="btn btn-success" onclick="showAddModal()">+ 新增人员</button>
                        <button class="btn btn-info" onclick="showImportModal()">导入</button>
                        <button class="btn btn-outline" onclick="downloadTemplate()">下载模板</button>
                        <button class="btn btn-danger" id="batchDeleteBtn" style="display:none;" onclick="batchDeleteStaff()">批量删除 (<span id="selectedCount">0</span>)</button>
                    </div>
                    <div style="overflow-x:auto;">
                        <table>
                            <thead id="staffThead"></thead>
                            <tbody id="staffTbody"></tbody>
                        </table>
                    </div>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="staffModal" style="display:none;">
        <div class="modal-overlay">
            <div class="modal" style="width:720px;">
                <div class="modal-header">
                    <h4 id="modalTitle">新增人员</h4>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div id="formFieldsArea"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="saveStaff()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="assessModal" style="display:none;">
        <div class="modal-overlay">
            <div class="modal" style="width:600px;">
                <div class="modal-header">
                    <h4>考核管理 - <span id="assessStaffName"></span></h4>
                    <button class="close-btn" onclick="closeAssessModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="assessStaffId">
                    <div class="toolbar" style="margin-bottom:16px;">
                        <label style="font-weight:500;">年份：</label>
                        <input type="number" class="form-control" id="assessYear" style="width:100px;">
                        <label style="font-weight:500;">等次：</label>
                        <select class="form-control" id="assessGrade" style="min-width:120px;">
                            <option value="优秀">优秀</option>
                            <option value="称职">称职</option>
                            <option value="称职以下">称职以下</option>
                        </select>
                        <label style="font-weight:500;">备注：</label>
                        <input type="text" class="form-control" id="assessRemark" placeholder="可选" style="min-width:120px;">
                        <button class="btn btn-primary" onclick="saveAssessment()">保存</button>
                    </div>
                    <table>
                        <thead>
                            <tr><th>年份</th><th>考核等次</th><th>备注</th><th>操作</th></tr>
                        </thead>
                        <tbody id="assessTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="changeModal" style="display:none;">
        <div class="modal-overlay">
            <div class="modal" style="width:700px;max-height:80vh;">
                <div class="modal-header">
                    <h4>变更记录 - <span id="changeStaffName"></span></h4>
                    <button class="close-btn" onclick="closeChangeModal()">&times;</button>
                </div>
                <div class="modal-body" style="max-height:60vh;overflow-y:auto;">
                    <table>
                        <thead>
                            <tr><th>序号</th><th>变更项目</th><th>原信息</th><th>新信息</th><th>操作人</th><th>变更时间</th></tr>
                        </thead>
                        <tbody id="changeTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" style="display:none;">
        <div class="modal-overlay">
            <div class="modal" style="width:900px;max-height:85vh;">
                <div class="modal-header">
                    <h4>人员详情 - <span id="detailStaffName"></span></h4>
                    <button class="close-btn" onclick="closeDetailModal()">&times;</button>
                </div>
                <div class="modal-body" style="max-height:70vh;overflow-y:auto;" id="detailBody">
                </div>
            </div>
        </div>
    </div>

    <div id="staffChangeModal" style="display:none;">
        <div class="modal-overlay">
            <div class="modal" style="width:500px;">
                <div class="modal-header">
                    <h4>变更信息 - <span id="staffChangeStaffName"></span></h4>
                    <button class="close-btn" onclick="closeStaffChangeModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="staffChangeId">
                    <div class="form-group">
                        <label>变更年月</label>
                        <input type="month" class="form-control" id="staffChangeMonth">
                    </div>
                    <div class="form-group">
                        <label>变更项目</label>
                        <select class="form-control" id="staffChangeField" onchange="onChangeFieldSelect()">
                            <option value="">请选择项目</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>原信息</label>
                        <input type="text" class="form-control" id="staffChangeOldValue" readonly>
                    </div>
                    <div class="form-group" id="staffChangeNewGroup">
                        <label>新信息</label>
                        <input type="text" class="form-control" id="staffChangeNewValue">
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea class="form-control" id="staffChangeRemark" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="closeStaffChangeModal()">取消</button>
                    <button class="btn btn-primary" onclick="saveStaffChange()">确认变更</button>
                </div>
            </div>
        </div>
    </div>

    <div id="importModal" style="display:none;">
        <div class="modal-overlay">
            <div class="modal" style="width:520px;">
                <div class="modal-header">
                    <h4>导入人员数据</h4>
                    <button class="close-btn" onclick="closeImportModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div style="margin-bottom:16px;padding:12px;background:#f0f7ff;border-radius:6px;font-size:13px;color:#555;">
                        <p style="margin:0 0 8px 0;"><b>导入说明：</b></p>
                        <p style="margin:0 0 4px 0;">1. 请先点击"下载模板"获取最新导入模板</p>
                        <p style="margin:0 0 4px 0;">2. 模板列会根据当前字段配置自动生成</p>
                        <p style="margin:0 0 4px 0;">3. 姓名为必填项，同名人员将更新已有记录</p>
                        <p style="margin:0;">4. 支持 .xlsx / .xls 格式</p>
                    </div>
                    <div class="form-group">
                        <label>选择文件</label>
                        <input type="file" id="importFile" class="form-control" accept=".xlsx,.xls">
                    </div>
                    <div id="importResult" style="display:none;margin-top:12px;padding:12px;border-radius:6px;font-size:13px;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline" onclick="closeImportModal()">关闭</button>
                    <button class="btn btn-primary" id="btnImport" onclick="doImport()">开始导入</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        var _fields = [];
        var _page = 1;
        var _deptUnits = {};
        initPage('staff_manage');

        loadDeptUnits();

        function loadDeptUnits() {
            apiGet('/api/dept_unit_map', function(res) {
                if (res.code === 200) {
                    _deptUnits = res.data;
                }
                loadDeptOptions();
            });
        }

        function loadDeptOptions() {
            apiGet('/api/dept_list', function(res) {
                if (res.code === 200) {
                    var deptData = [{value: '', text: '全部部门'}];
                    for (var i = 0; i < res.data.length; i++) {
                        deptData.push({value: res.data[i], text: res.data[i]});
                    }
                    $('#ssDept').searchSelect({
                        data: deptData,
                        placeholder: '全部部门',
                        searchPlaceholder: '搜索部门...',
                        value: '',
                        onChange: function(val) { onDeptChange(val); }
                    });
                }
            });

            $('#ssUnit').searchSelect({
                data: [{value: '', text: '全部单位'}],
                placeholder: '全部单位',
                searchPlaceholder: '搜索单位...',
                value: ''
            });

            $('#ssStatus').searchSelect({
                data: [
                    {value: '', text: '全部状态'},
                    {value: '在职', text: '在职'},
                    {value: '离职', text: '离职'}
                ],
                placeholder: '全部状态',
                searchPlaceholder: '搜索状态...',
                value: '在职'
            });
        }

        function onDeptChange(dept) {
            var unitData = [{value: '', text: '全部单位'}];
            if (dept && _deptUnits[dept]) {
                var units = _deptUnits[dept];
                for (var i = 0; i < units.length; i++) {
                    unitData.push({value: units[i], text: units[i]});
                }
            } else if (dept) {
                apiGet('/api/unit_list?dept=' + encodeURIComponent(dept), function(res) {
                    if (res.code === 200) {
                        var uData = [{value: '', text: '全部单位'}];
                        for (var i = 0; i < res.data.length; i++) {
                            uData.push({value: res.data[i], text: res.data[i]});
                        }
                        $('#ssUnit')[0].setOptions(uData);
                        $('#ssUnit')[0].setValue('');
                    }
                });
                return;
            }
            $('#ssUnit')[0].setOptions(unitData);
            $('#ssUnit')[0].setValue('');
        }

        function loadStaff(page) {
            _page = page || 1;
            var name = $('#searchName').val().trim();
            var dept = $('#ssDept').data('value') || '';
            var unit = $('#ssUnit').data('value') || '';
            var status = $('#ssStatus').data('value') || '';
            var params = 'page=' + _page + '&per_page=15';
            if (name) params += '&name=' + encodeURIComponent(name);
            if (dept) params += '&dept=' + encodeURIComponent(dept);
            if (unit) params += '&unit=' + encodeURIComponent(unit);
            if (status) params += '&status=' + encodeURIComponent(status);

            apiGet('/api/staff?' + params, function(res) {
                if (res.code === 200) {
                    _fields = res.data.fields || [];
                    updateStatusOptions();
                    renderThead();
                    renderTbody(res.data.list);
                    renderPagination('#pagination', res.data.total, res.data.page, res.data.per_page, 'loadStaff');
                }
            });
        }

        function updateStatusOptions() {
            var statusField = _fields.find(function(f) { return f.field_code === 'status'; });
            
            var statusData = [{value: '', text: '全部状态'}];
            
            if (statusField && statusField.options) {
                var opts = statusField.options.split(',');
                for (var i = 0; i < opts.length; i++) {
                    var optVal = opts[i].trim();
                    if (optVal) {
                        statusData.push({value: optVal, text: optVal});
                    }
                }
            } else {
                statusData.push(
                    {value: '在职', text: '在职'},
                    {value: '离职', text: '离职'}
                );
            }
            
            if ($('#ssStatus')[0] && typeof $('#ssStatus')[0].setOptions === 'function') {
                $('#ssStatus')[0].setOptions(statusData);
            }
        }

        function renderThead() {
            var html = '<tr><th style="width:40px;"><input type="checkbox" id="selectAllStaff" onclick="toggleSelectAll(this)"></th><th>序号</th>';
            var showFields = _fields.filter(function(f) { return f.show_in_list; });
            showFields.sort(function(a, b) { return a.sort_num - b.sort_num; });
            for (var i = 0; i < showFields.length; i++) {
                html += '<th>' + showFields[i].field_name + '</th>';
            }
            html += '<th>工龄</th><th>套改年限</th><th>操作</th></tr>';
            $('#staffThead').html(html);
        }

        function renderTbody(list) {
            var showFields = _fields.filter(function(f) { return f.show_in_list; });
            showFields.sort(function(a, b) { return a.sort_num - b.sort_num; });

            var html = '';
            for (var i = 0; i < list.length; i++) {
                var s = list[i];
                var isLocked = s.is_locked === 1 || s.is_locked === '1';
                html += '<tr>';
                html += '<td style="text-align:center;"><input type="checkbox" class="staff-checkbox" value="' + s.id + '" onclick="updateSelectedCount()"></td>';
                html += '<td>' + (i + 1) + '</td>';
                for (var j = 0; j < showFields.length; j++) {
                    var code = showFields[j].field_code;
                    var val = escapeHtml(s[code] || '-');
                    if (code === 'status') {
                        val = s.status === '在职' ? '<span class="badge badge-success">在职</span>' : '<span class="badge badge-danger">离职</span>';
                    } else if (code === 'name') {
                        var retirementStatus = s.retirement_status || 'normal';
                        var retirementMsg = s.retirement_msg || '';
                        var nameStyle = '';
                        var nameTitle = escapeAttr(s.name || '');
                        if (retirementStatus === 'retired') {
                            nameStyle = 'color:#ff4d4f;font-weight:600;';
                            if (retirementMsg) {
                                nameTitle += ' - ' + escapeAttr(retirementMsg);
                            }
                        } else if (retirementStatus === 'approaching') {
                            nameStyle = 'color:#fa8c16;font-weight:600;';
                            if (retirementMsg) {
                                nameTitle += ' - ' + escapeAttr(retirementMsg);
                            }
                        }
                        val = '<span style="' + nameStyle + '" title="' + nameTitle + '">' + escapeHtml(s.name || '-') + '</span>';
                    }
                    html += '<td>' + val + '</td>';
                }
                html += '<td>' + (s.work_years || 0) + '</td>';
                html += '<td>' + (s.taogai_years || 0) + '</td>';
                html += '<td>';
            if (isLocked) {
                html += '<button class="btn btn-sm btn-info" onclick="showDetail(' + s.id + ')">详情</button> ';
                html += '<button class="btn btn-sm btn-warning" onclick="showAssessment(' + s.id + ',\'' + escapeAttr(s.name || '') + '\')">考核</button> ';
                html += '<button class="btn btn-sm btn-primary" onclick="showStaffChange(' + s.id + ',\'' + escapeAttr(s.name || '') + '\')">变更</button> ';
                html += '<button class="btn btn-sm btn-success" onclick="unlockStaff(' + s.id + ')">解锁</button>';
            } else {
                html += '<button class="btn btn-sm btn-info" onclick="editStaff(' + s.id + ')">编辑</button> ';
                html += '<button class="btn btn-sm btn-warning" onclick="showAssessment(' + s.id + ',\'' + escapeAttr(s.name || '') + '\')">考核</button> ';
                html += '<button class="btn btn-sm btn-primary" onclick="lockStaff(' + s.id + ')">锁定</button> ';
                html += '<button class="btn btn-sm btn-danger" onclick="deleteStaff(' + s.id + ')">删除</button>';
            }
            html += '</td></tr>';
            }
            $('#staffTbody').html(html || '<tr><td colspan="99" class="text-center" style="color:#999;">暂无数据</td></tr>');
        }

        function buildFormField(fieldMeta, value) {
            var code = fieldMeta.field_code;
            var name = fieldMeta.field_name;
            var type = fieldMeta.field_type;
            var defaultVal = fieldMeta.default_val || '';
            var val = value !== undefined && value !== '' ? value : defaultVal;
            var html = '<div class="form-group"><label>' + name + '</label>';

            if (code === 'status') {
                html += '<select class="form-control" id="sf_' + code + '">';
                var opts = fieldMeta.options ? fieldMeta.options.split(',') : ['在职', '离职'];
                for (var k = 0; k < opts.length; k++) {
                    var sel = val === opts[k].trim() ? ' selected' : '';
                    html += '<option value="' + opts[k].trim() + '"' + sel + '>' + opts[k].trim() + '</option>';
                }
                html += '</select>';
            } else if (code === 'gender') {
                html += '<select class="form-control" id="sf_' + code + '">';
                html += '<option value="">请选择</option>';
                var gopts = fieldMeta.options ? fieldMeta.options.split(',') : ['男', '女'];
                for (var k = 0; k < gopts.length; k++) {
                    var sel = val === gopts[k].trim() ? ' selected' : '';
                    html += '<option value="' + gopts[k].trim() + '"' + sel + '>' + gopts[k].trim() + '</option>';
                }
                html += '</select>';
            } else if (type === 'select') {
                var linkField = fieldMeta.link_field || '';
                html += '<select class="form-control" id="sf_' + code + '" data-link-field="' + linkField + '">';
                html += '<option value="">请选择</option>';
                if (fieldMeta.options) {
                    var opts = fieldMeta.options.split(',');
                    for (var k = 0; k < opts.length; k++) {
                        var sel = val === opts[k].trim() ? ' selected' : '';
                        html += '<option value="' + opts[k].trim() + '"' + sel + '>' + opts[k].trim() + '</option>';
                    }
                }
                html += '</select>';
            } else if (type === 'number') {
                html += '<input type="number" class="form-control" id="sf_' + code + '" value="' + val + '">';
            } else if (type === 'date') {
                html += '<input type="date" class="form-control" id="sf_' + code + '" value="' + val + '">';
            } else if (type === 'dateym') {
                html += '<input type="month" class="form-control" id="sf_' + code + '" value="' + val + '">';
            } else {
                if (code === 'dept') {
                    html += '<select class="form-control" id="sf_' + code + '" onchange="onFormDeptChange()">';
                    html += '<option value="">请选择</option>';
                    var deptKeys = Object.keys(_deptUnits);
                    if (deptKeys.length > 0) {
                        for (var k = 0; k < deptKeys.length; k++) {
                            var sel = val === deptKeys[k] ? ' selected' : '';
                            html += '<option value="' + deptKeys[k] + '"' + sel + '>' + deptKeys[k] + '</option>';
                        }
                    } else {
                        html += '<input type="text" class="form-control" id="sf_' + code + '" value="' + val + '">';
                    }
                    html += '</select>';
                } else if (code === 'unit') {
                    html += '<select class="form-control" id="sf_' + code + '">';
                    html += '<option value="">请选择</option>';
                    if (val && _deptUnits) {
                        var formDept = '';
                        var deptEl = $('#sf_dept');
                        if (deptEl.length) formDept = deptEl.val();
                        if (formDept && _deptUnits[formDept]) {
                            var units = _deptUnits[formDept];
                            for (var k = 0; k < units.length; k++) {
                                var sel = val === units[k] ? ' selected' : '';
                                html += '<option value="' + units[k] + '"' + sel + '>' + units[k] + '</option>';
                            }
                        }
                    }
                    html += '</select>';
                } else {
                    html += '<input type="text" class="form-control" id="sf_' + code + '" value="' + val + '">';
                }
            }
            html += '</div>';
            return html;
        }

        function onFormDeptChange() {
            var dept = $('#sf_dept').val();
            var html = '<option value="">请选择</option>';
            if (dept && _deptUnits[dept]) {
                var units = _deptUnits[dept];
                for (var i = 0; i < units.length; i++) {
                    html += '<option value="' + units[i] + '">' + units[i] + '</option>';
                }
            }
            $('#sf_unit').html(html);
        }

        var _linkCache = {};

        function onLinkFieldChange(fieldCode) {
            var selectEl = $('#sf_' + fieldCode);
            var linkFieldCode = selectEl.data('link-field');
            if (!linkFieldCode) return;
            var linkVal = $('#sf_' + linkFieldCode).val();
            if (!linkVal) {
                var fieldMeta = _fields.find(function(f) { return f.field_code === fieldCode; });
                if (fieldMeta && fieldMeta.options) {
                    var html = '<option value="">请选择</option>';
                    var opts = fieldMeta.options.split(',');
                    for (var k = 0; k < opts.length; k++) {
                        html += '<option value="' + opts[k].trim() + '">' + opts[k].trim() + '</option>';
                    }
                    selectEl.html(html);
                }
                return;
            }
            var cacheKey = fieldCode + '_' + linkVal;
            if (_linkCache[cacheKey]) {
                selectEl.html(_linkCache[cacheKey]);
                return;
            }
            apiGet('/api/field_link_options?field=' + fieldCode + '&value=' + encodeURIComponent(linkVal) + '&link_field=' + encodeURIComponent(linkFieldCode), function(res) {
                if (res.code === 200) {
                    var html = '<option value="">请选择</option>';
                    for (var i = 0; i < res.data.length; i++) {
                        html += '<option value="' + res.data[i] + '">' + res.data[i] + '</option>';
                    }
                    _linkCache[cacheKey] = html;
                    selectEl.html(html);
                }
            });
        }

        function initLinkFields() {
            $('select[data-link-field]').each(function() {
                var code = $(this).attr('id').replace('sf_', '');
                var linkField = $(this).data('link-field');
                if (linkField) {
                    $('#sf_' + linkField).off('change.link').on('change.link', function() { onLinkFieldChange(code); });
                    if ($('#sf_' + linkField).val()) {
                        onLinkFieldChange(code);
                    }
                }
            });
        }

        function renderFormFields(data) {
            data = data || {};
            var allFields = _fields.slice();
            allFields.sort(function(a, b) { return a.sort_num - b.sort_num; });

            var html = '<div class="form-row">';
            var count = 0;
            for (var i = 0; i < allFields.length; i++) {
                var f = allFields[i];
                if (!f.is_active) continue;
                html += '<div class="form-group" style="flex:1;min-width:45%;">';
                html += buildFormField(f, data[f.field_code]);
                html += '</div>';
                count++;
                if (count % 2 === 0 && i < allFields.length - 1) {
                    html += '</div><div class="form-row">';
                }
            }
            if (count % 2 !== 0) {
                html += '<div class="form-group" style="flex:1;min-width:45%;"></div>';
            }
            html += '</div>';
            $('#formFieldsArea').html(html);
            requestAnimationFrame(function() { initLinkFields(); });
        }

        function showAddModal() {
            $('#editId').val('');
            renderFormFields();
            $('#modalTitle').text('新增人员');
            $('#staffModal').show();
        }

        function editStaff(id) {
            apiGet('/api/staff/' + id, function(res) {
                if (res.code === 200) {
                    var s = res.data;
                    _fields = s._fields || _fields;
                    $('#editId').val(s.id);
                    renderFormFields(s);
                    $('#modalTitle').text('编辑人员');
                    $('#staffModal').show();

        function doImport() {
            var fileInput = document.getElementById('importFile');
            if (!fileInput.files || !fileInput.files[0]) {
                showToast('请选择要导入的文件', 'error');
                return;
            }

            var file = fileInput.files[0];
            var ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'xlsx' && ext !== 'xls') {
                showToast('仅支持Excel文件（.xlsx/.xls）', 'error');
                return;
            }

            $('#btnImport').prop('disabled', true).text('导入中...');
            $('#importResult').hide();

            var formData = new FormData();
            formData.append('file', file);

            $.ajax({
                url: API + '/api/import/staff',
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                xhrFields: { withCredentials: true },
                success: function(res) {
                    if (res.code === 200) {
                        var d = res.data;
                        var html = '<div style="color:#155724;background:#d4edda;border:1px solid #c3e6cb;padding:10px;border-radius:4px;">';
                        html += '<b>' + escapeHtml(res.msg) + '</b>';
                        if (d.errors && d.errors.length > 0) {
                            html += '<div style="margin-top:8px;color:#856404;">';
                            html += '<b>警告信息：</b><ul style="margin:4px 0 0 16px;">';
                            for (var i = 0; i < d.errors.length; i++) {
                                html += '<li>' + escapeHtml(d.errors[i]) + '</li>';
                            }
                            html += '</ul></div>';
                        }
                        html += '</div>';
                        $('#importResult').html(html).show();
                        loadStaff(1);
                    } else {
                        var html = '<div style="color:#721c24;background:#f8d7da;border:1px solid #f5c6cb;padding:10px;border-radius:4px;">';
                        html += '<b>导入失败：</b>' + escapeHtml(res.msg);
                        html += '</div>';
                        $('#importResult').html(html).show();
                    }
                    $('#btnImport').prop('disabled', false).text('开始导入');
                },
                error: function(xhr) {
                    var msg = '导入请求失败';
                    try {
                        var res = JSON.parse(xhr.responseText);
                        if (res && res.msg) msg = res.msg;
                    } catch(e) {}
                    var html = '<div style="color:#721c24;background:#f8d7da;border:1px solid #f5c6cb;padding:10px;border-radius:4px;">';
                    html += '<b>导入失败：</b>' + escapeHtml(msg);
                    html += '</div>';
                    $('#importResult').html(html).show();
                    $('#btnImport').prop('disabled', false).text('开始导入');
                }
            });
        }

            html += '<span style="font-size:12px;color:#666;">第 ' + currentPage + '/' + totalPages + ' 页</span>';

            html += '</div>';

            var oldVal = '';
            if (_staffDataForChange) {
                oldVal = _staffDataForChange[fieldCode] || '';
            }
            $('#staffChangeOldValue').val(oldVal);
            
            var fieldMeta = _fields.find(function(f) { return f.field_code === fieldCode; });
            if (!fieldMeta) {
                $('#staffChangeNewGroup').html('<label>新信息</label><input type="text" class="form-control" id="staffChangeNewValue">');
                $('#staffChangeNewGroup').show();
                return;
            }

            if (fieldMeta.link_field && fieldMeta.link_options) {
                var sourceVal = _staffDataForChange ? (_staffDataForChange[fieldMeta.link_field] || '') : '';
                var html = '<label>新信息</label><select class="form-control" id="staffChangeNewValue"><option value="">请选择</option>';
                if (sourceVal && fieldMeta.link_options[sourceVal]) {
                    var linkedOpts = fieldMeta.link_options[sourceVal];
                    var optsArr = [];
                    if (Array.isArray(linkedOpts)) {
                        optsArr = linkedOpts;
                    } else if (typeof linkedOpts === 'string' && linkedOpts) {
                        optsArr = linkedOpts.split(',');
                    }
                    for (var k = 0; k < optsArr.length; k++) {
                        var opt = optsArr[k].trim();
                        if (opt) html += '<option value="' + opt + '">' + opt + '</option>';
                    }
                }
                if (fieldMeta.options) {
                    var baseOpts = fieldMeta.options.split(',');
                    for (var k = 0; k < baseOpts.length; k++) {
                        var opt = baseOpts[k].trim();
                        if (opt) html += '<option value="' + opt + '">' + opt + '</option>';
                    }
                }
                html += '</select>';
                $('#staffChangeNewGroup').html(html);
                $('#staffChangeNewGroup').show();
                return;
            }

            if (fieldCode === 'dept') {
                var html = '<label>新信息</label><select class="form-control" id="staffChangeNewValue"><option value="">请选择</option>';
                if (fieldMeta.options) {
                    var opts = fieldMeta.options.split(',');
                    for (var k = 0; k < opts.length; k++) {
                        var opt = opts[k].trim();
                        if (opt) html += '<option value="' + opt + '">' + opt + '</option>';
                    }
                }
                html += '</select>';
                $('#staffChangeNewGroup').html(html);
                $('#staffChangeNewGroup').show();
                return;
            }
            
            if (fieldCode === 'gender') {
                var opts = fieldMeta.options ? fieldMeta.options.split(',') : ['男', '女'];
                var html = '<label>新信息</label><select class="form-control" id="staffChangeNewValue"><option value="">请选择</option>';
                for (var k = 0; k < opts.length; k++) {
                    var opt = opts[k].trim();
                    if (opt) html += '<option value="' + opt + '">' + opt + '</option>';
                }
                html += '</select>';
                $('#staffChangeNewGroup').html(html);
            } else if (fieldCode === 'status') {
                var opts = fieldMeta.options ? fieldMeta.options.split(',') : ['在职', '离职'];
                var html = '<label>新信息</label><select class="form-control" id="staffChangeNewValue"><option value="">请选择</option>';
                for (var k = 0; k < opts.length; k++) {
                    var opt = opts[k].trim();
                    if (opt) html += '<option value="' + opt + '">' + opt + '</option>';
                }
                html += '</select>';
                $('#staffChangeNewGroup').html(html);
            } else if (fieldMeta.field_type === 'select') {
                var html = '<label>新信息</label><select class="form-control" id="staffChangeNewValue"><option value="">请选择</option>';
                if (fieldMeta.options) {
                    var opts = fieldMeta.options.split(',');
                    for (var i = 0; i < opts.length; i++) {
                        var opt = opts[i].trim();
                        if (opt) html += '<option value="' + opt + '">' + opt + '</option>';
                    }
                }
                html += '</select>';
                $('#staffChangeNewGroup').html(html);
            } else if (fieldMeta.field_type === 'date') {
                $('#staffChangeNewGroup').html('<label>新信息</label><input type="date" class="form-control" id="staffChangeNewValue">');
            } else if (fieldMeta.field_type === 'dateym') {
                $('#staffChangeNewGroup').html('<label>新信息</label><input type="month" class="form-control" id="staffChangeNewValue">');
            } else if (fieldMeta.field_type === 'number') {
                $('#staffChangeNewGroup').html('<label>新信息</label><input type="number" class="form-control" id="staffChangeNewValue">');
            } else {
                $('#staffChangeNewGroup').html('<label>新信息</label><input type="text" class="form-control" id="staffChangeNewValue">');
            }
            $('#staffChangeNewGroup').show();
        }

        function saveStaffChange() {
            var id = $('#staffChangeId').val();
            var fieldCode = $('#staffChangeField').val();
            var newVal = $('#staffChangeNewValue').val();
            var remark = $('#staffChangeRemark').val().trim();
            var changeMonth = $('#staffChangeMonth').val();
            
            if (!changeMonth) { showToast('请选择变更年月', 'error'); return; }
            if (!fieldCode) { showToast('请选择变更项目', 'error'); return; }
            if (!newVal) { showToast('请填写新信息', 'error'); return; }
            
            var postData = {
                field_code: fieldCode,
                new_value: newVal,
                change_month: changeMonth,
                remark: remark
            };
            console.log('saveStaffChange发送数据:', JSON.stringify(postData));
            
            apiPost('/api/staff/' + id + '/change', postData, function(res) {
                if (res.code === 200) {
                    showToast('变更成功', 'success');
                    closeStaffChangeModal();
                    loadStaff(_page);
                } else {
                    showToast(res.msg || '变更失败', 'error');
                }
            }, function(xhr) {
                var msg = '请求失败，请重试';
                try {
                    var res = JSON.parse(xhr.responseText);
                    if (res && res.msg) msg = res.msg;
                } catch(e) {}
                console.error('saveStaffChange失败:', xhr.status, xhr.responseText);
                showToast(msg, 'error');
            });
        }

        loadStaff(1);
    </script>
</body>
</html>
