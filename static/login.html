<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 人员薪酬管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body class="login-body">
    <div class="login-card">
        <h2>薪酬管理系统</h2>
        <p class="subtitle">人员薪资核算平台</p>
        <div id="loginError" class="alert alert-danger" style="display:none;"></div>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" value="admin">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" value="admin123">
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="doLogin()" style="margin-top:10px;">登 录</button>
        <p style="text-align:center;margin-top:16px;color:#6c757d;font-size:12px;">默认账号: admin / admin123</p>
    </div>
    <script src="js/common.js"></script>
    <script>
        $('#password').on('keydown', function(e) {
            if (e.keyCode === 13) doLogin();
        });
        function doLogin() {
            var username = $('#username').val().trim();
            var password = $('#password').val().trim();
            if (!username || !password) {
                $('#loginError').text('请输入用户名和密码').show();
                return;
            }
            apiPost('/api/login', { username: username, password: password }, function(res) {
                if (res.code === 200) {
                    window.location.href = 'index.html';
                } else {
                    $('#loginError').text(res.msg).show();
                }
            });
        }
    </script>
</body>
</html>
